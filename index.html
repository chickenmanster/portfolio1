<!DOCTYPE html>
<html lang="en">
<head>
    <title>archive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhefY6okws-velyhlWyNMI0lSZJWPy-7Npw5Sl7sFJedWtJ0ubnGb3Gor4zYd3wM7CoEegRgKZl3cZ2lHIM2lcdVVcGCMNso1qH2zNbFcSrhR5YT0CRr13Kk_lBhMpeQSWPYRW78OD5W-M/s1600/Exilim-EX-Z1000_1271.jpg">
    <script src="https://use.fontawesome.com/releases/v5.0.13/js/all.js" integrity="sha384-xymdQtn1n3lH2wcu0qhcdaOpQwyoarkgLVxC/wZ5q7h9gHtxICrpcaSUfygqZGOe" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --hover-color: #9e9e9e;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --hover-color: #b3b3b3;
        }

        html, body {
            font-family: JetBrains Mono, monospace;
            cursor: crosshair;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        footer {
            text-align: center;
            padding: 3px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .a {
            color: var(--text-color);
            text-decoration: none;
            cursor: none;
        }

        .a:hover {
            color: var(--hover-color);
        }

        .photo, .video, .file {
            z-index: 8;
            transition: 0.5s;
            width: 30vw;
            max-width: 150px;
            height: auto;
        }

        .photo:hover {
            transform: scale(1.3);
            content: url('canon3.png');
            cursor: none;
        }

        .video:hover {
            transform: scale(1.3);
            content: url('sony5.png');
            cursor: none;
        }

        .file:hover {
            transform: scale(1.3);
            content: url('file2.png');
            cursor: none;
        }

        .main iframe {
            width: 90%;
            max-width: 320px;
            height: 220px;
            margin: 20px auto;
            display: block;
        }

        .cursed:hover {
            cursor: url(https://png.pngtree.com/png-vector/20220909/ourmid/pngtree-smiley-sticker-face-png-image_6144836.png), auto;
        }

        .theme-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.9em;
            z-index: 20;
        }

        @media (max-width: 800px) {
            .photo, .video {
                width: 40vw;
                margin: 10px auto;
                display: block;
        }

        h1, h2 {
            text-align: center;
            margin-left: 0 !important;
        }

        .main iframe {
            width: 100%;
            height: 220px;
        }

        .a {
            cursor: auto;
        }

        body {
            cursor: auto;
        }
    }
    </style>
</head>
<body>

    <!-- Theme toggle button -->
    <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-crown" style="font-size: 24px;"></i></button>

    <h1 style="text-align: center;">Garrett Wage<a class="a" href="images/IMG_1216.JPG">r</a></h1>
    <h2 style="text-align: center;">the chickenmanster archive</h2>

    <div style="text-align: center;">
        <a href="photos.html" style="margin-left: 0%"><img class="photo" src="canon.png" /></a>
        <a href="video.html" style="margin-left: 44%"><img class="video" src="sony.png" /></a>
    </div>

    <div class="main">
        <iframe src="https://www.youtube.com/embed/E8-vlo_6XrI?si=wRaL-f91w9p5hAW4" width="300" height="220" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <footer>
        <p>
            <a class="a" href="https://www.instagram.com/garrettwagersucks/">Instagram</a> /
            <a class="a" href="https://www.youtube.com/@garrettwager">Youtube</a> /
            <a class="a" href="info.html">About</a> /
            <a class="a" href="mailto:chickenmanstergw@gmail.com">Contact</a>
        </p>
    </footer>

    <!-- Optional external JS -->
    <script src="main.js"></script>

    <!-- Responsive theme & layout logic -->
    <script>
        function isMobile() {
            return window.innerWidth <= 800;
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute("data-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem("theme") || "light";
            document.documentElement.setAttribute("data-theme", savedTheme);

            if (isMobile()) {
                document.body.style.cursor = "auto";
                document.querySelectorAll('.a, .photo, .video, .file').forEach(el => {
                    el.style.cursor = 'auto';
                });
                document.querySelectorAll('.cursed').forEach(el => {
                    el.classList.remove('cursed');
                });
            }
        });
    </script>

</body>
</html>
